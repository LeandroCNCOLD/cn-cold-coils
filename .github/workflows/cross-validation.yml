name: Cross-Validation · CN COLD Engine

on:
  push:
    branches: [main]
    paths:
      - 'src/modules/coldpro_v2/**'
      - 'src/modules/cn_coils/engine/**'
      - 'src/modules/coldpro_catalog/**'
      - 'src/lib/physicalConstants.ts'
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/coldpro_v2/**'
      - 'src/modules/cn_coils/engine/**'
      - 'src/modules/coldpro_catalog/**'

# Só roda quando engine ou catálogos mudam — não para mudanças de UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── JOB 1: Testes unitários ─────────────────────────────────────
  unit-tests:
    name: Testes unitários (645+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Rodar testes unitários
        run: bun run vitest run --reporter=verbose

      - name: Verificar tipos TypeScript
        run: bunx tsc --noEmit

  # ─── JOB 2: Cross-validation ─────────────────────────────────────
  cross-validation:
    name: Cross-Validation vs VapCyc / UNILAB
    runs-on: ubuntu-latest
    needs: unit-tests          # só roda se unit tests passarem
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Rodar cross-validation · VapCyc
        run: |
          bun run vitest run \
            src/modules/coldpro_v2/__tests__/cross-validation/crossValidation.test.ts \
            --reporter=verbose \
            2>&1 | tee cross-validation-results.txt

      - name: Verificar resultados
        run: |
          if grep -q "FAIL" cross-validation-results.txt; then
            echo "❌ Cross-validation falhou — engine diverge da referência"
            cat cross-validation-results.txt
            exit 1
          fi
          echo "✅ Cross-validation passou — engine alinhado com referências"

      - name: Upload relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-validation-report
          path: cross-validation-results.txt
          retention-days: 30

  # ─── JOB 3: Coverage report ──────────────────────────────────────
  coverage:
    name: Cobertura de testes
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'  # só na main
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar relatório de cobertura
        run: |
          bun run vitest run --coverage \
            --coverage.reporter=json \
            --coverage.reporter=text

      - name: Extrair métricas de cobertura
        run: |
          echo "## Cobertura de Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Módulo | Linhas | Funções | Branches |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          # Parse coverage/coverage-summary.json e formata tabela
          node -e "
            const c = require('./coverage/coverage-summary.json')
            const modules = ['coldpro_v2', 'cn_coils', 'coldpro_catalog']
            modules.forEach(m => {
              const keys = Object.keys(c).filter(k => k.includes(m))
              if(keys.length === 0) return
              const lines = Math.round(keys.reduce((a,k)=>a+c[k].lines.pct,0)/keys.length)
              const fns = Math.round(keys.reduce((a,k)=>a+c[k].functions.pct,0)/keys.length)
              const branches = Math.round(keys.reduce((a,k)=>a+c[k].branches.pct,0)/keys.length)
              console.log('|'+m+'|'+lines+'%|'+fns+'%|'+branches+'%|')
            })
          " >> $GITHUB_STEP_SUMMARY

  # ─── JOB 4: Atualizar badge no README ────────────────────────────
  update-badge:
    name: Atualizar badge de status
    runs-on: ubuntu-latest
    needs: [unit-tests, cross-validation]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Contar casos de cross-validation
        id: count
        run: |
          CASES=$(node -e "
            const v = require('./src/modules/coldpro_v2/__tests__/cross-validation/fixtures/vapcyc-ref-cases.json')
            const u = require('./src/modules/coldpro_v2/__tests__/cross-validation/fixtures/unilab-ref-cases.json')
            const p = require('./src/modules/coldpro_v2/__tests__/cross-validation/fixtures/physical-ref-cases.json')
            console.log(v.length + u.length + p.length)
          ")
          echo "total_cases=$CASES" >> $GITHUB_OUTPUT

      - name: Atualizar badge no README
        run: |
          DATE=$(date +%Y-%m-%d)
          CASES=${{ steps.count.outputs.total_cases }}
          # Atualiza a linha do badge no README.md
          sed -i "s|cross-validation-[0-9]*%2F[0-9]*|cross-validation-${CASES}%2F${CASES}|g" README.md
          sed -i "s|Última validação.*|Última validação: ${DATE}|g" README.md

      - name: Commit badge atualizado
        run: |
          git config user.name "CN COLD Bot"
          git config user.email "bot@cncold.com.br"
          git diff --quiet || (
            git add README.md
            git commit -m "chore: atualiza badge cross-validation [skip ci]"
            git push
          )
